<div class="text-black flex flex-col gap-8 p-2 max-w-screen-lg mx-auto">
    
    <h1 class="text-2xl text-blue font-bold">Simular Empréstimo</h1>
    
    <div class="flex flex-col md:flex-row gap-4">
        <div class="flex flex-col gap-2">
            <label class="font-medium block" for="seletor-produto">Produto de Empréstimo</label>
            <select class="default-input block" name="seletor-produto" id="seletor-produto">
                <option value="" disabled selected hidden>Selecione um produto</option>
                <option value="1">Consignado CAIXA Trabalhador</option>
                <option value="2">Consignado CAIXA</option>
                <option value="3">Empréstimo Pessoa Física</option>
                <option value="4">Empréstimo Pessoa Jurídica</option>
            </select>
        </div>
        <div class="flex flex-col gap-2" >
            <label class="font-medium" for="valor">Valor do Empréstimo</label>
            <input placeholder="ex: R$ 0000,00" class="default-input" type="text" name="valor" id="valor">
        </div>
        <div class="flex flex-col gap-2">
            <label class="font-medium" for="meses">Quantidade de Meses</label>
            <input placeholder="ex: 12" class="default-input" type="text" name="meses" id="meses">
        </div>
        <div class="flex flex-col justify-end ml-auto">
            <button class="font-medium rounded bg-orange py-2 px-4 text-white" >Simular</button>
        </div>
    </div>

    <div>
        <h2 class="mb-4 text-lg text-blue font-bold">Simulação para <span class="text-orange" >Consignado CAIXA Trabalhador</span></h2>
        <div class="bg-gray p-2 grid place-items-start grid-cols-2 sm:grid-cols-3 gap-2 mb-2 text-sm">
            <div class="flex flex-col">
                <span class="font-medium">Valor solicitado:</span>
                <span>R$ 10.000,00</span>
            </div>
            <div class="flex flex-col">
                <span class="font-medium">Prazo:</span>
                <span>12 meses</span>
            </div>
            <div class="flex flex-col">
                <span class="font-medium">Taxa efetiva mensal:</span>
                <span>1,39%</span>
            </div>
            <div class="flex flex-col">
                <span class="font-medium">Parcela mensal:</span>
                <span>R$ 931,50</span>
            </div>
            <div class="col-span-2 flex flex-col">
                <span class="font-medium">Valor total com juros:</span>
                <span>R$ 11.178,00</span>
            </div>
        </div>
        <h2 class="text-lg text-blue font-bold mb-4">Parcelas</h2>
        <div class="flex flex-col gap-2">
            <app-parcela></app-parcela>
            <app-parcela></app-parcela>
            <app-parcela></app-parcela>
            <app-parcela></app-parcela>
            <app-parcela></app-parcela>
        </div>

    </div>
</div>
