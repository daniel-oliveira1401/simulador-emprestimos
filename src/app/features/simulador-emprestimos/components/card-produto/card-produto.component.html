<div class="p-4 text-black shadow-md rounded border border-blue border-solid">
    <h3 class="mb-4 text-lg text-blue font-medium">{{produto.nome}}</h3>
    <div class="text-center flex gap-2 mb-8">
        <div class="p-2 bg-gray rounded-md">
            <span class="font-medium" >{{produto.taxaJuros}}%</span> ao ano
        </div>
        <div class="p-2 bg-gray rounded-md">
            <span class="font-medium">{{produto.prazoMaximo}}</span> meses
        </div>
    </div>
    <div class="flex justify-end">
        <button routerLink="{{'/simulacao/' + produto.id}}" class="rounded border border-orange text-orange px-2 py-1 hover:bg-orange hover:text-white">Simular</button>
    </div>
</div>
