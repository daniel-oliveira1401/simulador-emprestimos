<div class="p-4 text-black shadow-md rounded border border-blue border-solid">
    <h3 class="mb-4">{{produto.nome}}</h3>
    <div class="flex gap-2 mb-8">
        <div>
            {{produto.taxaJuros}} % ao ano
        </div>
        <div>
            {{produto.prazoMaximo}} Meses
        </div>
    </div>
    <div class="flex justify-end">
        <button routerLink="{{'/simulacao/' + produto.id}}" class="rounded border border-orange text-orange px-2 py-1 hover:bg-orange hover:text-white">Simular Empréstimo</button>
    </div>
</div>
