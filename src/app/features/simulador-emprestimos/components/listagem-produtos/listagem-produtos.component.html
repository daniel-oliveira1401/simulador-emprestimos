<div class="p-2 max-w-screen-lg mx-auto">
    
    <h1 class="font-bold text-2xl text-blue mb-4">Produtos de Empréstimo</h1>
    
    <div class="flex flex-col-reverse md:justify-between md:flex-row gap-2 mb-4">
        <div>
            <input class="w-full md:w-auto border border-solid border-black rounded p-2" placeholder="Buscar Empréstimo" type="text">
        </div>
        <div>
            <button (click)="abrirModalCadastroProduto()" class="w-full md:w-auto hover:bg-dark-orange p-2 bg-orange text-white rounded">Cadastrar Novo Produto</button>
        </div>
    </div>
    <div class="gap-4 grid custom-auto-size-grid">
        
        <div *ngFor="let produto of produtos">
            <app-card-produto [produto]="produto"></app-card-produto>
        </div>

    </div>

</div>
