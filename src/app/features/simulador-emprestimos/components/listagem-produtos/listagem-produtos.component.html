<div class="p-4 max-w-screen-lg mx-auto">
    <div class="flex justify-between mb-4">
        <div>
            <input class="border border-solid border-slate-700 rounded p-2" placeholder="Buscar Empréstimo" type="text">
        </div>
        <div>
            <button (click)="abrirModalCadastroProduto()" class="hover:bg-dark-orange p-2 bg-orange text-white rounded">Cadastrar Novo Produto</button>
        </div>
    </div>
    <div class="gap-4 grid custom-auto-size-grid">
        
        <div *ngFor="let produto of produtos">
            <app-card-produto [produto]="produto"></app-card-produto>
        </div>

    </div>

</div>
